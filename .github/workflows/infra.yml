name: infra

# AWS stack only (infra/aws). The Cloudflare stack is applied from a laptop, see README.
# PR       -> checks + plan, posted as a comment. Read-only role.
# main     -> plan-main saves the plan to the private state bucket and shows it in the run
#             summary. The apply job then WAITS for your approval (Environment "production")
#             and applies that exact saved plan, never a fresh one.

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.10.5"

defaults:
  run:
    working-directory: infra/aws

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the OIDC token
      contents: read
      pull-requests: write # post the plan comment
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_INFRA_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint

      - name: Checkov (security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/aws
          framework: terraform
          # Each skip is a deliberate cost/complexity decision for a personal static site:
          #  CKV_AWS_18/CKV_AWS_86  access logging           CKV_AWS_144  cross-region replication
          #  CKV_AWS_145            KMS on S3 (AES256 used)  CKV2_AWS_62  S3 event notifications
          #  CKV_AWS_68/CKV2_AWS_47 AWS WAF (Cloudflare does this job)
          #  CKV_AWS_310            origin failover          CKV_AWS_374  geo restriction
          #  CKV_AWS_259            HSTS preload/includeSubDomains: preload is near-irreversible, opt in later on purpose
          #  CKV_AWS_174            TLS 1.2 floor: the placeholder phase uses the default *.cloudfront.net
          #                         certificate, which cannot be pinned. The live branch sets TLSv1.2_2021.
          skip_check: CKV_AWS_18,CKV_AWS_86,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_68,CKV2_AWS_47,CKV_AWS_310,CKV_AWS_374,CKV_AWS_259,CKV_AWS_174

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment plan on the PR
        uses: actions/github-script@v7
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/aws/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see the job log)';
            const ok = process.env.PLAN_EXIT === '0';
            const body = `### Terraform plan ${ok ? '' : '(FAILED)'}\n\`\`\`\n${plan}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: Fail the job if the plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  plan-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_INFRA_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      # -detailed-exitcode: 0 = nothing to do, 1 = error, 2 = changes to apply.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then echo "Plan failed"; exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi

      - name: Show the plan in the run summary
        run: |
          {
            echo '### Terraform plan (review this before approving the apply)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Private bucket, not a GitHub artifact: a plan file can hold secret values, and
      # artifacts on a public repository can be downloaded by anyone.
      - name: Save the plan privately
        if: steps.plan.outputs.changes == 'true'
        run: aws s3 cp tfplan "s3://${{ vars.TF_STATE_BUCKET }}/plans/${{ github.sha }}.tfplan" --sse AES256

  apply:
    needs: plan-main
    if: github.event_name == 'push' && needs.plan-main.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production # GitHub pauses here until a required reviewer approves
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_INFRA_APPLY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Fetch the plan you reviewed
        run: aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/plans/${{ github.sha }}.tfplan" tfplan

      # Terraform refuses a saved plan if the state changed since it was made ("stale plan").
      - name: Apply exactly that plan
        run: terraform apply -input=false -no-color tfplan

      - name: Remove the saved plan
        if: always()
        run: aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/plans/${{ github.sha }}.tfplan" || true

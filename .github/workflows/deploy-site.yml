name: deploy-site

# site/** only. Pull requests build and check but never deploy.
# Push to main builds, uploads to S3, and invalidates the CloudFront cache.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_site: ${{ steps.detect.outputs.has_site }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Is there a real site yet?
        run: |
          if [ -f site/package.json ]; then echo "has_site=true" >> "$GITHUB_OUTPUT"; else echo "has_site=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_site == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install, check, build
        if: steps.detect.outputs.has_site == 'true'
        working-directory: site
        run: |
          npm ci
          npm run check --if-present
          npm run build

      - name: Pick the folder to publish
        run: |
          if [ "${{ steps.detect.outputs.has_site }}" = "true" ]; then
            cp -r site/dist publish
          else
            echo "No site/package.json yet: publishing the placeholder page."
            cp -r site/placeholder publish
          fi
          test -f publish/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: publish

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_SITE_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed build assets never change under the same name, so cache them for a year.
      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync publish "s3://${{ vars.SITE_BUCKET }}" \
            --exclude "*" --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else is revalidated each time, then removed from S3 if no longer built.
      - name: Upload pages and the rest (revalidate)
        run: |
          aws s3 sync publish "s3://${{ vars.SITE_BUCKET }}" \
            --exclude "_astro/*" --delete \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/*"
